<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">OneMore — Less planning. More playing.</title><desc id="desc">A warm white poster with black lettering, a red hand-drawn circle and an invitation to make time for friends.</desc>
<rect width="1440" height="600" fill="#f8f6f1"/>
<g fill="none" stroke="#e9e5dc" stroke-width="1"><path d="M0 100H1440M0 200H1440M0 300H1440M0 400H1440M0 500H1440"/><path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600M800 0V600M900 0V600M1000 0V600M1100 0V600M1200 0V600M1300 0V600M1400 0V600"/></g>
<g font-family="Arial, Helvetica, sans-serif" fill="#181818">
<text x="88" y="92" font-size="18" font-weight="700" letter-spacing="4">MAKE TIME FOR YOUR PEOPLE</text>
<text x="80" y="262" font-size="158" font-weight="900" letter-spacing="-9">OneMore<tspan fill="#ff2b2b">.</tspan></text>
<text x="88" y="350" font-size="48" font-weight="700" letter-spacing="-1">Less planning. More playing.</text>
<text x="90" y="433" font-size="23" fill="#555">One account. Separate spaces. A time that works.</text>
<text x="90" y="533" font-size="16" font-weight="700" letter-spacing="2">BUILT BY CHAOAN LI</text>
</g>
