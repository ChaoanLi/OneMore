# 用法：在服务器上配置好 .env 后执行  docker compose up -d --build
# - app：算我一个（API + H5），数据保存在 appdata 卷里的 SQLite 文件
# - caddy：自动申请/续期 HTTPS 证书，把 https://$DOMAIN 转发给 app
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/couju.db
    volumes:
      - appdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  appdata:
  caddy_data:
  caddy_config:
